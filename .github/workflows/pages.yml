name: Build & deploy (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily posts"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build
        env:
          # 미리보기(github.io) 설정 — 정식 도메인 전환 시 SITE_URL=https://changupguide.co.kr, SITE_BASE 비움, NOINDEX 삭제, CNAME 추가
          SITE_URL: ${{ vars.SITE_URL || 'https://zzangusz-art.github.io' }}
          SITE_BASE: ${{ vars.SITE_URL == '' && 'changupguide' || vars.SITE_BASE }}
          NOINDEX: ${{ vars.NOINDEX || '1' }}
          API_URL: ${{ vars.API_URL || '' }}
          CNAME: ${{ vars.CNAME || '' }}
          # 외부(창업미디어) 수집 매물 노출: 미리보기는 1, 정식 오픈 시 0 (검증 완료 매물만 공개)
          SHOW_LEGACY: ${{ vars.SHOW_LEGACY || '1' }}
        run: node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
