name: Uptime check
# 10분마다 운영 사이트 확인 — 1분 넘게 응답이 없으면 이 작업이 실패로 표시되고 GitHub가 저장소 관리자에게 메일을 보냄
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check site
        run: |
          for i in 1 2 3 4; do
            code=$(curl -s -o /tmp/h.json -w "%{http_code}" --max-time 25 "https://www.changupguide.co.kr/healthz" || true)
            if [ "$code" = "200" ]; then
              cat /tmp/h.json; echo
              curl -s -o /dev/null -w "home %{http_code} %{time_total}s\n" --max-time 25 "https://www.changupguide.co.kr/"
              exit 0
            fi
            echo "try $i: HTTP $code"; sleep 20
          done
          echo "사이트가 응답하지 않습니다 (www.changupguide.co.kr)"; exit 1
