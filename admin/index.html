<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>창업가이드 관리자</title>
<link rel="icon" href="../favicon.ico" sizes="any"><link rel="icon" href="../img/brand/mark.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="admin.css">
<script>window.CU_API = "__API_URL__"; window.CU_BASE = "__SITE_BASE__";</script>
</head>
<body>
<canvas id="spaceCanvas" class="space-canvas" aria-hidden="true"></canvas>
<script>
/* 우주 배경 (로그인 화면 전용) — 별이 천천히 흐르고 마우스 반대 방향으로 패럴랙스, 반짝임, 이따금 별똥별 */
window.spaceBg = (() => {
  const canvas = document.getElementById('spaceCanvas');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, stars = [], shooting = [], mx = 0, my = 0, tx = 0, ty = 0, raf = null, t = 0;
  function resize() {
    W = canvas.width = canvas.offsetWidth * dpr; H = canvas.height = canvas.offsetHeight * dpr; stars = [];
    const n = Math.min(420, Math.floor(W * H / 4200));
    for (let i = 0; i < n; i++) { const depth = Math.random(); stars.push({ x: Math.random() * W, y: Math.random() * H, depth, r: (0.4 + depth * 1.4) * dpr, tw: Math.random() * Math.PI * 2, hue: Math.random() < .12 ? 210 : Math.random() < .06 ? 45 : 0 }); }
  }
  function frame() {
    t += 0.016; tx += (mx - tx) * 0.04; ty += (my - ty) * 0.04;
    ctx.clearRect(0, 0, W, H);
    const g1 = ctx.createRadialGradient(W * .78 - tx * 40, H * .24 - ty * 40, 0, W * .78, H * .24, W * .45); g1.addColorStop(0, 'rgba(48, 74, 150, .16)'); g1.addColorStop(1, 'transparent');
    const g2 = ctx.createRadialGradient(W * .16 - tx * 25, H * .78 - ty * 25, 0, W * .16, H * .78, W * .4); g2.addColorStop(0, 'rgba(96, 52, 130, .12)'); g2.addColorStop(1, 'transparent');
    ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H); ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
    for (const s of stars) {
      if (!still) { s.x += (0.06 + s.depth * 0.22) * dpr; if (s.x > W + 4) s.x = -4; }
      const px = s.x - tx * (14 + s.depth * 48) * dpr, py = s.y - ty * (14 + s.depth * 48) * dpr;
      const a = still ? 0.8 : 0.35 + 0.65 * Math.abs(Math.sin(t * (0.5 + s.depth) + s.tw));
      ctx.beginPath(); ctx.fillStyle = s.hue ? `hsla(${s.hue}, 80%, 78%, ${a})` : `rgba(230,238,255,${a})`; ctx.arc(px, py, s.r, 0, Math.PI * 2); ctx.fill();
    }
    if (!still && Math.random() < 0.004 && shooting.length < 2) shooting.push({ x: Math.random() * W * .8, y: Math.random() * H * .3, vx: (6 + Math.random() * 5) * dpr, vy: (2.5 + Math.random() * 2) * dpr, life: 1 });
    shooting = shooting.filter(sh => sh.life > 0);
    for (const sh of shooting) { ctx.strokeStyle = `rgba(200,220,255,${sh.life * .8})`; ctx.lineWidth = 1.4 * dpr; ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(sh.x - sh.vx * 6, sh.y - sh.vy * 6); ctx.stroke(); sh.x += sh.vx; sh.y += sh.vy; sh.life -= 0.02; }
    raf = still ? null : requestAnimationFrame(frame);
  }
  addEventListener('resize', () => { if (raf || still) { resize(); if (still) frame(); } });
  addEventListener('mousemove', e => { mx = (e.clientX / innerWidth - 0.5) * 2; my = (e.clientY / innerHeight - 0.5) * 2; });
  return {
    start() { canvas.hidden = false; if (raf) return; resize(); frame(); },
    stop() { if (raf) { cancelAnimationFrame(raf); raf = null; } canvas.hidden = true; }
  };
})();
</script>
<div id="app" aria-live="polite"><div class="loading">관리자 불러오는 중…</div></div>
<div class="toast-host" id="toasts"></div>
<script type="module" src="admin.js"></script>
</body>
</html>
